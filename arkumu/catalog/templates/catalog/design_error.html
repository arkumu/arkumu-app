{% extends "base_design.html" %}
{% load static %}
{% block title %}arkumu - Error{% endblock title %}

{% block content %}
<div class="w-full min-h-screen flex items-center justify-center">
  <div class="text-center p-8">
    <h1 class="text-2xl font-mono mb-4 text-arkumu-dark theme-dark:text-arkumu-light theme-blue:text-arkumu-blue">
      Ein Fehler ist aufgetreten
    </h1>
    <p class="text-lg font-mono text-arkumu-dark/70 theme-dark:text-arkumu-light/70 theme-blue:text-arkumu-blue/70 mb-6">
      {{ error }}
    </p>
    <a href="{% url 'catalog:design' %}"
       class="inline-block px-6 py-2 font-mono text-sm
              border border-arkumu-dark text-arkumu-dark bg-arkumu-light
              theme-dark:border-arkumu-light theme-dark:text-arkumu-light theme-dark:bg-arkumu-dark
              theme-blue:border-arkumu-blue theme-blue:text-arkumu-blue theme-blue:bg-arkumu-light
              hover:bg-opacity-10 transition-colors">
      Zurück zur Übersicht
    </a>
  </div>
</div>
{% endblock content %}
