<div class="w-full px-4 py-8 transition-colors
            text-arkumu-dark
            theme-dark:text-arkumu-light
            theme-blue:text-arkumu-blue">
  <div class="w-full max-w-7xl mx-auto">
    <h2 class="text-3xl font-medium mb-8">Ereignisliste</h2>
    {% if events %}
      <div class="space-y-6">
        {% for event in events %}
          {% include 'catalog/blocks/project_event_item.html' with event=event %}
        {% endfor %}
      </div>
    {% else %}
      <p class="text-sm text-arkumu-dark/70 theme-dark:text-arkumu-light/70">Keine Ereignisse vorhanden.</p>
    {% endif %}
  </div>
</div>
