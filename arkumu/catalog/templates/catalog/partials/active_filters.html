{% load catalog_tags %}
{% if query and results %}
<div class="border rounded bg-yellow-50 p-3">
    <h3 class="font-bold text-sm mb-2">Search Results For</h3>
    <div class="space-y-1 text-xs">
        <div class="flex items-center justify-between">
            <span class="truncate">"{{ query|truncatechars:20 }}"</span>
            <button type="button"
                    _="on click set the value of <input[name='q']/> to '' then trigger keyup on <input[name='q']/>"
                    class="text-red-500 hover:text-red-700">Clear</button>
        </div>
        {% if selected_property %}
        <div class="text-xs text-gray-600">
            in {{ selected_property|uri_tail }}
        </div>
        {% endif %}
    </div>
</div>
{% endif %}
