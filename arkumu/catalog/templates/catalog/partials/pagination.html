<!-- Pagination Component with HTMX and Dynamic State -->
<div class="pagination-component w-full mb-8">


  <!-- Pagination Buttons -->
  <div class="flex items-center justify-between w-full">

    <!-- Zurück Button -->
    {% if has_previous %}
    <button hx-get="{% url 'catalog:browse' %}?page={{ previous_page }}{% if query %}&query={{ query }}{% endif %}"
            hx-target="#search-results-container"
            hx-push-url="true"
            hx-indicator="#search-loading"
            class="flex items-center space-x-2 font-mono text-sm transition-colors
                  text-arkumu-dark
                  theme-dark:text-arkumu-light
                  theme-blue:text-arkumu-blue
                  hover:opacity-70 cursor-pointer">
      <span class="text-3xl">‹</span>
      <span>zurück</span>
    </button>
    {% else %}
    <button disabled
            class="flex items-center space-x-2 font-mono text-sm transition-colors
                  text-arkumu-dark/30
                  theme-dark:text-arkumu-light/30
                  theme-blue:text-arkumu-blue/30
                  cursor-not-allowed">
      <span class="text-3xl">‹</span>
      <span>zurück</span>
    </button>
    {% endif %}

    <!-- Page Numbers -->
    <div class="flex items-center space-x-1">

      {% for page_num in page_range %}
        {% if page_num == "..." %}
          <!-- Ellipsis -->
          <span class="w-8 h-8 font-mono text-sm flex items-center justify-center
                      text-arkumu-dark
                      theme-dark:text-arkumu-light
                      theme-blue:text-arkumu-blue">
            ...
          </span>
        {% else %}
          <!-- Page Number Button -->
          <button hx-get="{% url 'catalog:browse' %}?page={{ page_num }}{% if query %}&query={{ query }}{% endif %}"
                  hx-target="#search-results-container"
                  hx-push-url="true"
                  hx-indicator="#search-loading"
                  class="w-8 h-8 font-mono text-sm transition-colors flex items-center justify-center
                        {% if page_num == current_page %}
                          bg-arkumu-dark text-arkumu-light
                          theme-dark:bg-arkumu-light theme-dark:text-arkumu-dark
                          theme-blue:bg-arkumu-blue theme-blue:text-arkumu-light
                        {% else %}
                          border border-arkumu-dark text-arkumu-dark bg-arkumu-light
                          theme-dark:border-arkumu-light theme-dark:text-arkumu-light theme-dark:bg-arkumu-dark
                          theme-blue:border-arkumu-blue theme-blue:text-arkumu-blue theme-blue:bg-arkumu-light
                          hover:bg-opacity-10 cursor-pointer
                        {% endif %}">
            {{ page_num }}
          </button>
        {% endif %}
      {% endfor %}

    </div>

    <!-- Weiter Button -->
    {% if has_next %}
    <button hx-get="{% url 'catalog:browse' %}?page={{ next_page }}{% if query %}&query={{ query }}{% endif %}"
            hx-target="#search-results-container"
            hx-push-url="true"
            hx-indicator="#search-loading"
            class="flex items-center space-x-2 font-mono text-sm transition-colors
                  text-arkumu-dark
                  theme-dark:text-arkumu-light
                  theme-blue:text-arkumu-blue
                  hover:opacity-70 cursor-pointer">
      <span>weiter</span>
      <span class="text-3xl">›</span>
    </button>
    {% else %}
    <button disabled
            class="flex items-center space-x-2 font-mono text-sm transition-colors
                  text-arkumu-dark/30
                  theme-dark:text-arkumu-light/30
                  theme-blue:text-arkumu-blue/30
                  cursor-not-allowed">
      <span>weiter</span>
      <span class="text-3xl">›</span>
    </button>
    {% endif %}

  </div>
</div>
