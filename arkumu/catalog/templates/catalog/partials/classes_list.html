{% load catalog_tags %}
{% if available_classes %}
<div class="border rounded bg-white p-3">
    <h3 class="font-bold text-sm mb-2">📦 Classes</h3>

    {% if available_classes|length > 10 %}
    <div class="mb-2">
        <input type="text"
               placeholder="Filter classes..."
               class="w-full text-xs px-2 py-1 border rounded"
               oninput="filterClasses(this.value)">
    </div>
    {% endif %}

    <div class="space-y-1 max-h-64 overflow-y-auto text-xs" id="classes-list">
        {% for class_uri, class_info in available_classes.items %}
        <label class="flex items-center hover:bg-gray-50 p-1 rounded cursor-pointer class-item"
               data-name="{{ class_info.name|lower }}">
            <input type="radio" name="class" value="{{ class_uri }}"
                   {% if selected_class == class_uri %}checked{% endif %}
                   hx-get="{% url 'catalog:explorer_properties' %}"
                   hx-trigger="change"
                   hx-include="[name='organization']:checked"
                   hx-vals='{"class": "{{ class_uri }}"}'
                   hx-target="#properties-section"
                   class="mr-2">
            <div class="flex-1 min-w-0">
                <div class="truncate font-medium">{{ class_info.name }}</div>
                <div class="text-gray-500 text-xs">{{ class_info.entity_count }} entities</div>
            </div>
        </label>
        {% endfor %}
    </div>

    <div class="mt-2 text-xs text-gray-500">
        💡 Select a class to see its properties
    </div>
</div>

<script>
function filterClasses(term) {
    const items = document.querySelectorAll('.class-item');
    const searchTerm = term.toLowerCase();

    items.forEach(item => {
        const name = item.dataset.name;
        if (name.includes(searchTerm)) {
            item.style.display = '';
        } else {
            item.style.display = 'none';
        }
    });
}
</script>
{% endif %}
