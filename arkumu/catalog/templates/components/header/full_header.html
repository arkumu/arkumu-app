{% load static %}

<style>
  @media (max-width: 834px) {
    /* Oculta los botones de tema, botones de imagen y el botón de búsqueda */
    .theme-buttons,
    .image-buttons,
    .search-button-wrapper {
      display: none !important;
    }

    /* Alinea el resto (menú) hacia la derecha del logo */
    .header-inner {
      justify-content: space-between !important;
    }
  }
</style>

<!-- Header -->
<header class="w-full py-8 px-4 transition-colors
               text-arkumu-dark
               theme-dark:text-arkumu-light
               theme-blue:text-arkumu-light">
  <div class="header-inner flex items-center justify-between w-full">

    <!-- Logo -->
    <div class="header-logo w-48 md:w-56 lg:w-64 transition-all duration-300">
      <a href="/catalog/browse/" class="block">
        <img src="{% static 'images/arkumu-logo-light.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 block theme-dark:hidden theme-blue:hidden">
        <img src="{% static 'images/arkumu-logo-dark.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 hidden theme-dark:block theme-blue:hidden">
        <img src="{% static 'images/arkumu-logo-blue.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 hidden theme-dark:hidden theme-blue:block">
      </a>
    </div>

    <!-- Theme buttons and icons -->
    <div class="flex items-center ml-auto">
      <!-- Botones de imagen -->
      <div class="image-buttons flex items-center space-x-3 mr-10">
        <button class="w-14 h-14 md:w-16 md:h-16 lg:w-20 lg:h-20 transition-all duration-300 hover:opacity-70">
          <img src="{% static 'images/zoom.svg' %}" alt="Button 1"
               class="w-full h-full">
        </button>
        <button class="w-14 h-14 md:w-16 md:h-16 lg:w-20 lg:h-20 transition-all duration-300 hover:opacity-70">
          <img src="{% static 'images/language.svg' %}" alt="Button 2"
               class="w-full h-full">
        </button>
        <button class="w-14 h-14 md:w-16 md:h-16 lg:w-20 lg:h-20 transition-all duration-300 hover:opacity-70">
          <img src="{% static 'images/english.svg' %}" alt="Button 3"
               class="w-full h-full">
        </button>
      </div>

      <!-- Botones de tema -->
      <div class="theme-buttons">
        {% include 'components/header/theme_buttons.html' %}
      </div>

      <div class="w-6 md:w-8 lg:w-10 transition-all duration-300"></div>

      <div class="flex items-center space-x-4 md:space-x-5 lg:space-x-6 transition-all duration-300">
        <!-- Botón de búsqueda -->
        <div class="search-button-wrapper flex flex-col items-center">
          {% include 'components/header/search_button.html' %}
          <span class="text-xs mt-1 font-mono
          text-arkumu-dark
          theme-dark:text-arkumu-light
          theme-blue:text-arkumu-blue">Suche</span>
        </div>

        <!-- Botón de menú -->
        <div class="flex flex-col items-center">
          {% include 'components/header/menu_button.html' %}
          <span class="text-xs mt-1 font-mono
          text-arkumu-dark
          theme-dark:text-arkumu-light
          theme-blue:text-arkumu-blue">Menü</span>
        </div>
      </div>
    </div>

  </div>
</header>
