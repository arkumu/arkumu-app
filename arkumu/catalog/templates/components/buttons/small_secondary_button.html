<!-- Small Theme-aware Secondary Button -->
<button type="button" class="px-4 py-2 text-sm font-mono transition-colors border
  bg-transparent text-arkumu-dark border-arkumu-dark hover:bg-arkumu-light-hover
  theme-dark:bg-arkumu-dark theme-dark:text-arkumu-light theme-dark:border-arkumu-light theme-dark:hover:bg-arkumu-dark-hover
  theme-blue:bg-transparent theme-blue:text-arkumu-blue theme-blue:border-arkumu-blue theme-blue:hover:bg-arkumu-blue-hover theme-blue:hover:bg-opacity-20">
  {{ button_text|default:"Buttontext" }}
</button>
