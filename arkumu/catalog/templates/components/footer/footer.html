<!-- Footer Component with Complete Theme Support -->
{% load static %}
<footer class="w-full transition-colors
               bg-arkumu-dark text-arkumu-light
               theme-dark:bg-arkumu-light theme-dark:text-arkumu-dark
               theme-blue:bg-arkumu-blue theme-blue:text-arkumu-light">
  <div class="container mx-auto px-6 py-12">
    <!-- Arkumu Logo -->
    <div class="mb-12 w-48 md:w-56 lg:w-64">
      <a href="/catalog/browse/" class="block">
        <!-- Logo para tema predeterminado (claro) - en footer usa el dark porque el fondo es oscuro -->
        <img src="{% static 'images/arkumu-logo-dark.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 block theme-dark:hidden theme-blue:hidden">

        <!-- Logo para tema oscuro - en footer usa el light porque el fondo es claro -->
        <img src="{% static 'images/arkumu-logo-light.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 hidden theme-dark:block theme-blue:hidden">

        <!-- Logo para tema azul -->
        <img src="{% static 'images/arkumu-logo-light.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 hidden theme-dark:hidden theme-blue:block">
      </a>
    </div>

    <!-- Kooperationspartner Section -->
    <div class="mb-12">
      <h3 class="text-sm font-medium mb-6">Kooperationspartner</h3>
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4 mb-6">
        <div class="transition-colors bg-arkumu-light p-4 flex items-center justify-center">
          <img src="{% static 'images/folkwang-logo.png' %}" alt="Folkwang Universität der Künste" class="max-h-12 w-auto">
        </div>
        <div class="transition-colors bg-arkumu-light p-4 flex items-center justify-center">
          <img src="{% static 'images/hbz-logo.png' %}" alt="hbz" class="max-h-12 w-auto">
        </div>
        <div class="transition-colors bg-arkumu-light p-4 flex items-center justify-center">
          <img src="{% static 'images/hochschule-logo.png' %}" alt="Hochschule für Musik und Tanz Köln" class="max-h-12 w-auto">
        </div>
        <div class="transition-colors bg-arkumu-light p-4 flex items-center justify-center">
          <img src="{% static 'images/detmold-logo.png' %}" alt="Hochschule für Musik Detmold" class="max-h-12 w-auto">
        </div>
        <div class="transition-colors bg-arkumu-light p-4 flex items-center justify-center">
          <img src="{% static 'images/kunstakademie-logo.png' %}" alt="Kunstakademie Düsseldorf" class="max-h-12 w-auto">
        </div>
      </div>
      
      <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
        <div class="transition-colors bg-arkumu-light p-4 flex items-center justify-center">
          <img src="{% static 'images/robert-schumann-logo.png' %}" alt="Robert Schumann Hochschule" class="max-h-12 w-auto">
        </div>
        <div class="transition-colors bg-arkumu-light p-4 flex items-center justify-center">
          <img src="{% static 'images/itcc-logo.png' %}" alt="IT Center University of Cologne" class="max-h-12 w-auto">
        </div>
        <div class="transition-colors bg-arkumu-light p-4 flex items-center justify-center">
          <img src="{% static 'images/uni-koeln-logo.png' %}" alt="Universität zu Köln" class="max-h-12 w-auto">
        </div>
      </div>
    </div>

    <!-- Bottom Section -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- Gefördert durch -->
      <div>
        <h3 class="text-sm font-medium mb-4">Gefördert durch:</h3>
        <div class="transition-colors bg-arkumu-light p-4 inline-block">
          <img src="{% static 'images/mkw-nrw-logo.png' %}" alt="Ministerium für Kultur und Wissenschaft des Landes Nordrhein-Westfalen" class="h-16 w-auto">
        </div>
      </div>

      <!-- Empfohlen von -->
      <div>
        <h3 class="text-sm font-medium mb-4">Ein Kooperationsvorhaben empfohlen von:</h3>
        <div class="transition-colors bg-arkumu-light p-4 inline-block">
          <img src="{% static 'images/digitale-hochschule-logo.png' %}" alt="Digitale Hochschule NRW" class="h-16 w-auto">
        </div>
      </div>
    </div>

    <!-- Footer Links -->
    <div class="mt-12 pt-6 border-t transition-colors
                border-arkumu-light
                theme-dark:border-arkumu-dark
                theme-blue:border-arkumu-light">
      <nav class="flex flex-wrap gap-6 text-sm">
        <a href="#impressum" class="hover:underline transition-colors
                                    hover:text-arkumu-light
                                    theme-dark:hover:text-arkumu-dark
                                    theme-blue:hover:text-white">
          Impressum
        </a>
        <a href="#nutzungsbedingungen" class="hover:underline transition-colors
                                              hover:text-arkumu-light
                                              theme-dark:hover:text-arkumu-dark
                                              theme-blue:hover:text-white">
          Nutzungsbedingungen
        </a>
        <a href="#datenschutz" class="hover:underline transition-colors
                                      hover:text-arkumu-light
                                      theme-dark:hover:text-arkumu-dark
                                      theme-blue:hover:text-white">
          Datenschutzerklärung
        </a>
        <a href="#privatsphaere" class="hover:underline transition-colors
                                        hover:text-arkumu-light
                                        theme-dark:hover:text-arkumu-dark
                                        theme-blue:hover:text-white">
          Privatsphäre Einstellungen
        </a>
        <a href="#kontakt" class="hover:underline transition-colors
                                  hover:text-arkumu-light
                                  theme-dark:hover:text-arkumu-dark
                                  theme-blue:hover:text-white">
          Kontakt
        </a>
        <a href="#barrierefreiheit" class="hover:underline transition-colors
                                           hover:text-arkumu-light
                                           theme-dark:hover:text-arkumu-dark
                                           theme-blue:hover:text-white">
          Barrierefreiheit
        </a>
      </nav>
    </div>
  </div>
</footer>
