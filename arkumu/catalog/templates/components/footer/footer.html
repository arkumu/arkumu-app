<!-- Footer Component with Complete Theme Support -->
{% load static %}
<footer class="w-full transition-colors
               bg-arkumu-dark text-arkumu-light
               theme-dark:bg-arkumu-light theme-dark:text-arkumu-dark
               theme-blue:bg-arkumu-blue theme-blue:text-arkumu-light">
  <div class="container mx-auto px-6 py-12">
    <!-- Arkumu Logo -->
    <div class="mb-12 w-48 md:w-56 lg:w-64">
      <a href="/catalog/browse/" class="block">
        <!-- Logo para tema predeterminado (claro) - en footer usa el dark porque el fondo es oscuro -->
        <img src="{% static 'images/arkumu-logo-dark.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 block theme-dark:hidden theme-blue:hidden">

        <!-- Logo para tema oscuro - en footer usa el light porque el fondo es claro -->
        <img src="{% static 'images/arkumu-logo-light.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 hidden theme-dark:block theme-blue:hidden">

        <!-- Logo para tema azul -->
        <img src="{% static 'images/arkumu-logo-dark.svg' %}" alt="arkumu logo"
             class="w-full h-auto transition-all duration-300 hidden theme-dark:hidden theme-blue:block">
      </a>
    </div>

    <!-- Kooperationspartner Section -->
    <div class="mb-12">
      <h3 class="text-sm font-medium mb-6">Kooperationspartner</h3>
      <div class="flex flex-wrap gap-4 mb-6">
        <div class="transition-colors bg-arkumu-light">
          <a href="/catalog/browse/?orga_code=Folkwang Universität der Künste">
            <img src="{% static 'images/Logo_03.svg' %}" alt="Folkwang Universität der Künste" class="h-20 w-auto">
          </a>
        </div>
        <div class="transition-colors bg-arkumu-light">
          <img src="{% static 'images/Logo_04.svg' %}" alt="hbz" class="h-20 w-auto">
        </div>
        <div class="transition-colors bg-arkumu-light">
          <a href="/catalog/browse/?orga_code=Hochschule für Musik und Tanz Köln">
            <img src="{% static 'images/Logo_09.svg' %}" alt="Hochschule für Musik und Tanz Köln" class="h-20 w-auto">
          </a>
        </div>
        <div class="transition-colors bg-arkumu-light">
          <a href="/catalog/browse/?orga_code=Hochschule für Musik Detmold">
            <img src="{% static 'images/Logo_08.svg' %}" alt="Hochschule für Musik Detmold" class="h-20 w-auto">
          </a>
        </div>
        <div class="transition-colors bg-arkumu-light">
                    <a href="/catalog/browse/?orga_code=Kunsthochschule für Medien Köln">
          <img src="{% static 'images/Logo_07.svg' %}" alt="Kunsthochschule für Medien Köln" class="h-20 w-auto">
                    </a>
        </div>
      </div>

      <div class="flex flex-wrap gap-4">
        <div class="transition-colors bg-arkumu-light">
          <a href="/catalog/browse/?orga_code=Hochschule für Musik und Tanz Köln">
            <img src="{% static 'images/Logo_05.svg' %}" alt="Robert Schumann Hochschule" class="h-20 w-auto">
          </a>
        </div>
        <div class="transition-colors bg-arkumu-light">
          <img src="{% static 'images/Logo_01.svg' %}" alt="IT Center University of Cologne" class="h-20 w-auto">
        </div>
        <div class="transition-colors bg-arkumu-light">
          <img src="{% static 'images/Logo_06.svg' %}" alt="Universität zu Köln" class="h-20 w-auto">
        </div>
      </div>
    </div>

    <!-- Bottom Section with Footer Links -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
      <!-- Gefördert durch -->
      <div>
        <h3 class="text-sm font-medium mb-4">Gefördert durch:</h3>
        <div class="transition-colors bg-arkumu-light inline-block">
          <img src="{% static 'images/Logo_10.svg' %}"
               alt="Ministerium für Kultur und Wissenschaft des Landes Nordrhein-Westfalen" class="h-24 w-auto">
        </div>
      </div>

      <!-- Empfohlen von -->
      <div>
        <h3 class="text-sm font-medium mb-4">Ein Kooperationsvorhaben empfohlen von:</h3>
        <div class="transition-colors bg-arkumu-light inline-block">
          <img src="{% static 'images/Logo_02.svg' %}" alt="Digitale Hochschule NRW" class="h-24 w-auto">
        </div>
      </div>

      <!-- Footer Links - Moved to right column -->
      <div class="lg:pt-8">
        <nav class="flex flex-col gap-3 text-sm">
          <a href="/catalog/impressum/" class="hover:underline transition-colors
                                      hover:text-arkumu-light
                                      theme-dark:hover:text-arkumu-dark
                                      theme-blue:hover:text-white">
            Impressum
          </a>
          <a href="#nutzungsbedingungen" class="hover:underline transition-colors
                                                hover:text-arkumu-light
                                                theme-dark:hover:text-arkumu-dark
                                                theme-blue:hover:text-white">
            Nutzungsbedingungen
          </a>
          <a href="#datenschutz" class="hover:underline transition-colors
                                        hover:text-arkumu-light
                                        theme-dark:hover:text-arkumu-dark
                                        theme-blue:hover:text-white">
            Datenschutzerklärung
          </a>
          <a href="#privatsphaere" class="hover:underline transition-colors
                                          hover:text-arkumu-light
                                          theme-dark:hover:text-arkumu-dark
                                          theme-blue:hover:text-white">
            Privatsphäre Einstellungen
          </a>
          <a href="#kontakt" class="hover:underline transition-colors
                                    hover:text-arkumu-light
                                    theme-dark:hover:text-arkumu-dark
                                    theme-blue:hover:text-white">
            Kontakt
          </a>
          <a href="#barrierefreiheit" class="hover:underline transition-colors
                                             hover:text-arkumu-light
                                             theme-dark:hover:text-arkumu-dark
                                             theme-blue:hover:text-white">
            Barrierefreiheit
          </a>
        </nav>
      </div>
    </div>
  </div>
</footer>
