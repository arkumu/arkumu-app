<!-- Dotted Line Component with Theme-aware Colors -->
<div class="w-full my-8">
  <!-- Dotted line that spans the full width - themed with gradients -->
  <div class="w-full h-[2px] mb-4 bg-repeat-x bg-center bg-[length:12px_2px]
    bg-[radial-gradient(circle,var(--dot-color,#1E1E1E)_2px,rgba(0,0,0,0)_2px)]
    [--dot-color:theme(colors.arkumu.blue)]
    theme-dark:[--dot-color:theme(colors.arkumu.blue)]
    theme-blue:[--dot-color:theme(colors.arkumu.blue)]"></div>
</div>
