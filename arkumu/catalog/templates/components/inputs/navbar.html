<!-- Arkumu Navbar Component with Theme Support -->
<!-- Search Bar -->
<div class="container mx-auto px-4 my-5">
  <div class="flex w-full">
    <input type="text" 
           class="flex-grow px-4 py-3 font-mono transition-colors
                  bg-arkumu-light 
                  border border-arkumu-dark
                  text-arkumu-dark
                  placeholder:text-arkumu-dark
                  theme-dark:bg-arkumu-dark
                  theme-dark:border-arkumu-light
                  theme-dark:text-arkumu-light
                  theme-dark:placeholder:text-arkumu-light
                  theme-blue:border-arkumu-blue
                  theme-blue:text-arkumu-blue
                  theme-blue:placeholder:text-arkumu-blue"
           placeholder="{{placeholder_text}}" 
           id="searchbar"
           name="query"
           hx-get="../design_search_results"
           hx-target="#search_results"
           hx-swap="outerHTML"
           hx-include="#searchbar"
           hx-trigger="keyup[keyCode==13]"
          >
    <!-- Reducido el margen izquierdo de ml-2 a ml-1 -->
    <button type="button" 
            class="ml-1 px-6 py-3 font-medium font-mono transition-colors
                   bg-arkumu-dark text-arkumu-light hover:bg-arkumu-dark-hover
                   theme-dark:bg-arkumu-light theme-dark:text-arkumu-dark theme-dark:hover:bg-arkumu-light-hover
                   theme-blue:bg-arkumu-blue theme-blue:text-arkumu-light theme-blue:hover:bg-arkumu-blue-hover"
            hx-get="../design_search_results"
            hx-target="#search_results"
            hx-swap="outerHTML"
            hx-include="#searchbar"
            hx-trigger="click">
      Projekte durchsuchen
    </button>
  </div>
</div>
