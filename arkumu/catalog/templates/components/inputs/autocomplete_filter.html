{% comment %}
Autocomplete filter component with HTMX
Usage:
  {% include "components/inputs/autocomplete_filter.html" with
     filter_type="akteur"
     param_name="aktuer"
     placeholder="Akteur*in"
     selected_values=actors
  %}
{% endcomment %}

<div class="autocomplete-container relative" data-filter-type="{{ filter_type }}" data-param-name="{{ param_name }}">
  <!-- Hidden inputs for selected values -->
  <div id="hidden-inputs-{{ filter_type }}" class="hidden">
    {% for value in selected_values %}
    <input type="hidden" name="{{ param_name }}" value="{{ value }}">
    {% endfor %}
  </div>

  <!-- Input with dropdown -->
  <div class="relative">
    <input type="text"
           id="input-{{ filter_type }}"
           placeholder="{{ placeholder }}"
           autocomplete="off"
           class="w-full appearance-none border px-4 py-3 pr-8 transition-colors
                  border-gray-400 bg-white
                  theme-dark:border-gray-600 theme-dark:bg-arkumu-dark
                  theme-blue:border-arkumu-blue theme-blue:bg-white
                  font-mono text-sm
                  text-arkumu-dark
                  theme-dark:text-arkumu-light
                  theme-blue:text-arkumu-blue
                  focus:outline-none focus:border-gray-600"
           hx-get="{% url 'catalog:filter_autocomplete' filter_type %}"
           hx-trigger="input changed delay:300ms, focus"
           hx-target="#dropdown-{{ filter_type }}"
           hx-include="[name='{{ param_name }}']"
           name="q"
           onfocus="showDropdown('{{ filter_type }}')"
           onblur="hideDropdownDelayed('{{ filter_type }}')">

    <!-- Dropdown arrow -->
    <div class="absolute right-0 top-0 h-full flex items-center pointer-events-none">
      <div class="h-full w-px transition-colors bg-gray-400 theme-dark:bg-gray-600 theme-blue:bg-arkumu-blue mr-3"></div>
      <div class="mr-3 transition-colors text-arkumu-dark theme-dark:text-arkumu-light theme-blue:text-arkumu-blue">
        v
      </div>
    </div>

    <!-- Dropdown container -->
    <div id="dropdown-{{ filter_type }}"
         class="absolute z-50 w-full mt-1 border shadow-lg hidden transition-colors
                border-gray-400 bg-white
                theme-dark:border-gray-600 theme-dark:bg-arkumu-dark
                theme-blue:border-arkumu-blue theme-blue:bg-white">
    </div>
  </div>
</div>
