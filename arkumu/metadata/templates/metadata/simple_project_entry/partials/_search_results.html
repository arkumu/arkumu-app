{% if results %}
<ul class="dropdown-content bg-base-100 rounded-box z-[1] w-full p-2 shadow max-h-60 overflow-y-auto">
  {% for item in results %}
  <li>
    <button type="button"
            class="w-full text-left px-3 py-2 rounded hover:bg-base-200 cursor-pointer"
            onclick="addSelectedEntity('{{ dataset_name }}', '{{ item.uri }}', '{{ item.label|escapejs }}')">
      {{ item.label }}
    </button>
  </li>
  {% endfor %}
</ul>
{% elif query %}
<div class="p-2 text-sm text-base-content/60">Keine Ergebnisse</div>
{% endif %}
