{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container mx-auto py-4">
  <!-- Secondary Navigation Bar -->
  <div class="bg-base-200 rounded-lg p-2 mb-4 shadow-sm">
    <ul class="menu menu-horizontal w-full justify-center gap-2">
      <li>
        <a href="{% url 'metadata:tabular_projects' %}"
           class="{% if entity_type == 'project' %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
          </svg>
          Projects
        </a>
      </li>
      <li>
        <a href="{% url 'metadata:tabular_events' %}"
           class="{% if entity_type == 'event' %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          Events
        </a>
      </li>
      <li>
        <a href="{% url 'metadata:tabular_actors' %}"
           class="{% if entity_type == 'actor' %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          Actors
        </a>
      </li>
      <li>
        <a href="{% url 'metadata:tabular_digital_objects' %}"
           class="{% if entity_type == 'digital_object' %}active{% endif %}">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
          Digital Objects
        </a>
      </li>
    </ul>
  </div>

  <!-- Table Card -->
  <div class="card bg-base-100 shadow-xl">
    <div class="card-body">
      <h2 class="card-title text-2xl mb-4">
        {{ dataset_name }}
        <span class="badge badge-primary">{{ page_obj.paginator.count }} rows</span>
      </h2>

      <!-- Table Container with HTMX -->
      <div id="table-container">
        {% include "metadata/tabular/partials/table_rows.html" %}
      </div>
    </div>
  </div>
</div>
{% endblock content %}
