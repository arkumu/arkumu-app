<div class="p-4">
    <h3 class="font-bold text-lg mb-4">Link to Ontology</h3>
    
    {% if resource %}
    <div class="space-y-4">
        <div class="alert alert-info">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" class="stroke-current shrink-0 w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span>Linking <strong>{{ resource.name }}</strong> to external ontologies</span>
        </div>
        
        <form class="space-y-4">
            <!-- Placeholder for ontology linking form -->
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Ontology Source</span>
                </label>
                <select class="select select-bordered">
                    <option>Select ontology source...</option>
                    <option>Wikidata</option>
                    <option>DBpedia</option>
                    <option>Schema.org</option>
                </select>
            </div>
            
            <div class="form-control">
                <label class="label">
                    <span class="label-text">External Identifier</span>
                </label>
                <input type="text" placeholder="Enter external ID or URI" class="input input-bordered" />
            </div>
            
            <div class="modal-action">
                <button type="button" class="btn btn-ghost" onclick="document.getElementById('resource-modal').close()">Cancel</button>
                <button type="submit" class="btn btn-primary">Link Ontology</button>
            </div>
        </form>
    </div>
    {% else %}
    <div class="alert alert-error">
        <span>Resource not found</span>
    </div>
    {% endif %}
</div>
