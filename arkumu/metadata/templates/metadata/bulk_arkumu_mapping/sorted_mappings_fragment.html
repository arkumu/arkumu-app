<table id="mappings-table-{{ org_code }}" class="table table-sm table-hover mb-0">
    <thead class="table-light sticky-top">
        <tr>
            <th width="80">
                <button class="flex items-center gap-1 text-xs font-semibold hover:text-primary"
                        hx-get="{% url 'metadata:bulk_arkumu_mapping_sort' %}?org_code={{ org_code }}&sort=type&order={% if current_sort.sort == 'type' and current_sort.order == 'asc' %}desc{% else %}asc{% endif %}"
                        hx-target="#mappings-table-{{ org_code }}"
                        hx-swap="outerHTML">
                    Type
                    {% if current_sort.sort == 'type' %}
                        {% if current_sort.order == 'asc' %}▲{% else %}▼{% endif %}
                    {% else %}
                        <span class="opacity-30">↕</span>
                    {% endif %}
                </button>
            </th>
            <th>
                <button class="flex items-center gap-1 text-xs font-semibold hover:text-primary"
                        hx-get="{% url 'metadata:bulk_arkumu_mapping_sort' %}?org_code={{ org_code }}&sort=source&order={% if current_sort.sort == 'source' and current_sort.order == 'asc' %}desc{% else %}asc{% endif %}"
                        hx-target="#mappings-table-{{ org_code }}"
                        hx-swap="outerHTML">
                    Source
                    {% if current_sort.sort == 'source' %}
                        {% if current_sort.order == 'asc' %}▲{% else %}▼{% endif %}
                    {% else %}
                        <span class="opacity-30">↕</span>
                    {% endif %}
                </button>
            </th>
            <th>
                <button class="flex items-center gap-1 text-xs font-semibold hover:text-primary"
                        hx-get="{% url 'metadata:bulk_arkumu_mapping_sort' %}?org_code={{ org_code }}&sort=target&order={% if current_sort.sort == 'target' and current_sort.order == 'asc' %}desc{% else %}asc{% endif %}"
                        hx-target="#mappings-table-{{ org_code }}"
                        hx-swap="outerHTML">
                    Target
                    {% if current_sort.sort == 'target' %}
                        {% if current_sort.order == 'asc' %}▲{% else %}▼{% endif %}
                    {% else %}
                        <span class="opacity-30">↕</span>
                    {% endif %}
                </button>
            </th>
            <th>
                <button class="flex items-center gap-1 text-xs font-semibold hover:text-primary"
                        hx-get="{% url 'metadata:bulk_arkumu_mapping_sort' %}?org_code={{ org_code }}&sort=label&order={% if current_sort.sort == 'label' and current_sort.order == 'asc' %}desc{% else %}asc{% endif %}"
                        hx-target="#mappings-table-{{ org_code }}"
                        hx-swap="outerHTML">
                    Label
                    {% if current_sort.sort == 'label' %}
                        {% if current_sort.order == 'asc' %}▲{% else %}▼{% endif %}
                    {% else %}
                        <span class="opacity-30">↕</span>
                    {% endif %}
                </button>
            </th>
        </tr>
    </thead>
    <tbody>
    {% for mapping in mappings %}
    <tr>
        <td>
            {% if mapping.resource_type == 'Class' %}
                <span class="badge bg-info">Class</span>
            {% else %}
                <span class="badge bg-success">Property</span>
            {% endif %}
        </td>
        <td class="font-monospace small text-primary">
            <div style="word-break: break-all;">{{ mapping.source_iri }}</div>
        </td>
        <td class="font-monospace small text-success">
            <div style="word-break: break-all;">{{ mapping.target_iri }}</div>
        </td>
        <td>{{ mapping.label }}</td>
    </tr>
    {% endfor %}
    </tbody>
</table>
