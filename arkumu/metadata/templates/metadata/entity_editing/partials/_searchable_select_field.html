<div class="form-control"
     id="searchable-field-{{ field_name }}"
     hx-on::after-swap="const input=this.querySelector('[data-search-input]');if(input){const len=input.value.length;input.focus();input.setSelectionRange(len,len);}}">
  <label class="label">
    <span class="label-text font-medium">{{ field.label }}</span>
    {% if field.errors %}
      <span class="label-text-alt text-error">{{ field.errors.0 }}</span>
    {% endif %}
  </label>
  <div class="flex items-center gap-2">
    {% include "metadata/entity_creation/partials/_searchable_select_input.html" %}
    <button type="button"
            class="btn btn-ghost btn-sm"
            hx-get="{{ search_url }}"
            hx-target="#searchable-field-{{ field_name }}"
            hx-swap="outerHTML"
            hx-include="#searchable-field-{{ field_name }} select"
            hx-vals='{"q": ""}'>
      Reset
    </button>
  </div>
  <div class="mt-2" data-search-options>
    {{ field }}
    {% if field.help_text %}
      <div class="text-xs text-base-content/60 mt-1">{{ field.help_text }}</div>
    {% endif %}
  </div>
</div>
