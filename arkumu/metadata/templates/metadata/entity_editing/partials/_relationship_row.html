{% if wrap|default:True %}
<div class="space-y-1" id="{{ row_id }}">
{% endif %}
  <div class="flex gap-2">
    {# Hidden input that stores the actual URI (this gets submitted) #}
    <input type="hidden"
           name="{{ field_name }}[]"
           id="{{ input_id }}-hidden"
           value="{{ stored_value|default:'' }}"
           data-uri="{{ stored_value|default:'' }}"
           data-label="{{ display_value|default:'' }}">

    {# Visible input for display/search (not submitted) #}
    <input type="text"
           id="{{ input_id }}"
           name="q"
           class="input input-bordered flex-1"
           placeholder="Wert eingeben"
           value="{{ display_value|default:'' }}"
           hx-get="{{ suggestion_url }}&input_id={{ input_id }}&target_id={{ suggestions_id }}{% if property_select_id %}&property_select_id={{ property_select_id }}{% endif %}{% if selected_property %}&property={{ selected_property|urlencode }}{% endif %}"
           hx-trigger="input changed delay:200ms"
           hx-target="#{{ suggestions_id }}"
           hx-include="this{% if property_select_id %}, #{{ property_select_id }}{% endif %}"
           autocomplete="off">
    {% if resource_id %}
    <a href="{% url 'metadata:resource_graph' resource_id %}"
       class="btn btn-primary btn-sm btn-circle"
       title="View resource graph"
       target="_blank">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
      </svg>
    </a>
    {% endif %}
    <button type="button"
            class="btn btn-ghost btn-sm btn-circle"
            hx-delete="{% url 'metadata:entity_workspace_relationship_row' mapping_id %}?row_id={{ row_id }}"
            hx-target="#{{ row_id }}"
            hx-swap="outerHTML"
            hx-confirm="Diesen Eintrag entfernen?">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
      </svg>
    </button>
  </div>
  <div id="{{ suggestions_id }}"
       class="mt-1 max-h-48 overflow-y-auto border border-base-300 rounded-lg bg-base-100 shadow-sm empty:hidden">
  </div>
{% if wrap|default:True %}
</div>
{% endif %}
