{% extends "base.html" %} {% load static %} {% block content %}
<div class="max-w-4xl mx-auto py-8">
  <div class="card bg-base-100 shadow-xl border border-base-200">
    <div class="card-body p-8">
      <div class="flex items-center mb-6">
        <div class="p-3 rounded-xl mr-4 bg-secondary/10">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-8 w-8 text-secondary"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
        </div>
        <div>
          <h1 class="card-title text-2xl font-bold">Ereignis bearbeiten</h1>
          <p class="text-base-content/70 mt-1">
            Aktualisiere die wichtigsten Angaben für dieses Ereignis.
          </p>
        </div>
      </div>

      <form action="{% url 'metadata:edit_event' %}" method="post" class="space-y-8">
        {% csrf_token %} 
        
        {% include "metadata/entity_creation/partials/_event_form_sections_v2.html" %}

        <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t">
          <a
            href="{% url 'metadata:metadata_entry' %}"
            class="btn btn-outline"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 mr-2"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            Abbrechen
          </a>
          <button type="submit" class="btn btn-primary px-8">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 mr-2"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
            Speichern
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock content %}
