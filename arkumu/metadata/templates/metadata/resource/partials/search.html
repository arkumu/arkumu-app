<div class="card bg-base-100 shadow-lg">
    <div class="card-body">
        <h2 class="card-title mb-4">Search Resources</h2>
        
        <div class="form-control mb-4">
            <label class="label">
                <span class="label-text">Search by name, URI, or value</span>
            </label>
            <div class="flex gap-2">
                <input type="text" 
                       id="search-input"
                       placeholder="Enter search terms..."
                       class="input input-bordered flex-1"
                       hx-get="{% url 'metadata:search_resources_htmx' %}"
                       hx-trigger="keyup changed delay:500ms"
                       hx-target="#search-results"
                       hx-indicator="#search-indicator"
                       hx-vals='{"mode": "search"}'>
                <span id="search-indicator" class="htmx-indicator loading loading-spinner loading-md"></span>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div class="form-control">
                <label class="label">
                    <span class="label-text">Resource Type</span>
                </label>
                <select class="select select-bordered" 
                        hx-get="{% url 'metadata:search_resources_htmx' %}"
                        hx-trigger="change"
                        hx-target="#search-results"
                        hx-include="#search-input, #org-filter"
                        name="type">
                    <option value="">All Types</option>
                    <option value="IRI">🔗 IRI</option>
                    <option value="CLASS">📦 Class</option>
                    <option value="PROPERTY">🔧 Property</option>
                    <option value="LITERAL">📝 Literal</option>
                </select>
            </div>

            <div class="form-control">
                <label class="label">
                    <span class="label-text">Organization</span>
                </label>
                <select id="org-filter" 
                        class="select select-bordered"
                        hx-get="{% url 'metadata:search_resources_htmx' %}"
                        hx-trigger="change"
                        hx-target="#search-results"
                        hx-include="#search-input, select[name='type']"
                        name="org">
                    <option value="">All Organizations</option>
                    {% for org in organizations %}
                    <option value="{{ org.id }}">{{ org.name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-control">
                <label class="label">
                    <span class="label-text">Quick Filters</span>
                </label>
                <div class="flex flex-wrap gap-1">
                    <button class="btn btn-xs btn-outline"
                            hx-get="{% url 'metadata:search_resources_htmx' %}?has_triples=true"
                            hx-target="#search-results">
                        With Links
                    </button>
                    <button class="btn btn-xs btn-outline"
                            hx-get="{% url 'metadata:search_resources_htmx' %}?has_triples=false"
                            hx-target="#search-results">
                        No Links
                    </button>
                </div>
            </div>
        </div>

        <div class="divider">Search Results</div>

        <div id="search-results">
            <div class="text-center py-8 text-base-content/50">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
                <p>Start typing to search resources</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Auto-focus search input when tab is loaded
    document.getElementById('search-input')?.focus();
</script>
