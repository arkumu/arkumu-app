<form action="{{ form_action }}"
      method="post"
      hx-post="{{ form_action }}"
      hx-target="#entity-form-container"
      hx-swap="outerHTML"
      class="card bg-base-100 border border-base-300 shadow-sm"
      data-entity-form="{{ entity_type }}">
  <div class="card-body space-y-6">
    <div class="flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold">{{ entity_title }}</h2>
        <p class="text-sm text-base-content/70">Nutze die Felder, um einen neuen Datensatz anzulegen oder einen bestehenden auszuwählen.</p>
      </div>
      <span class="htmx-indicator loading loading-spinner loading-sm"></span>
    </div>

    {% csrf_token %}

    {% if success_message %}
      <div class="alert alert-success shadow-lg">
        <div class="flex items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
          </svg>
          <span>{{ success_message }}</span>
        </div>
      </div>
    {% endif %}

    {% if error_message %}
      <div class="alert alert-error shadow-lg">
        <div class="flex items-center gap-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12c0 4.971-4.029 9-9 9s-9-4.029-9-9 4.029-9 9-9 9 4.029 9 9z" />
          </svg>
          <span>{{ error_message }}</span>
        </div>
      </div>
    {% endif %}

    <div id="entity-fields" hx-swap="innerHTML transition:true">
      {% include form_partial %}
    </div>

    <div class="flex flex-col sm:flex-row justify-end gap-3 pt-4 border-t border-dashed border-base-300">
      <button type="reset" class="btn btn-outline btn-sm">Reset</button>
      <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
    </div>
  </div>
</form>
