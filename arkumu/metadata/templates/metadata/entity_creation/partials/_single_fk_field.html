{# Single FK field with hidden URI input and visible label input #}
<div class="flex gap-2">
  {# Hidden input that stores the actual URI (this gets submitted) #}
  <input type="hidden"
         name="{{ field_name }}"
         id="{{ input_id }}-hidden"
         value="{{ uri_value|default:'' }}"
         data-uri="{{ uri_value|default:'' }}"
         data-label="{{ display_value|default:'' }}">

  {# Visible input for display/search (not submitted) #}
  <input type="text"
         id="{{ input_id }}"
         name="q_{{ field_name }}"
         class="{{ css_class }}"
         placeholder="{{ placeholder|default:'Wert eingeben' }}"
         value="{{ display_value|default:'' }}"
         {% if search_url %}
         hx-get="{{ search_url }}&input_id={{ input_id }}&target_id={{ target_id }}"
         hx-trigger="input changed delay:200ms"
         hx-target="#{{ target_id }}"
         hx-include="this"
         {% endif %}
         autocomplete="off"
         {% if required %}required{% endif %}>
</div>

{% if target_id %}
<div id="{{ target_id }}"
     class="mt-1 max-h-48 overflow-y-auto border border-base-300 rounded-lg bg-base-100 shadow-sm empty:hidden">
</div>
{% endif %}
