<div class="w-full mx-auto px-4 sm:px-6 lg:px-8">
    <div class="space-y-6 p-6">
        <div class="bg-base-200 rounded-box p-6">
            <h1 class="text-2xl font-bold">Metadata Workspace</h1>
            <p class="text-sm text-base-content/70 mt-2">
                Wähle eine Entität aus und durchschaue die vorhandenen Einträge in der Tabellenansicht.
            </p>
        </div>

        <div class="space-y-6">
            <!-- Organization selector at top -->
            <div class="card bg-base-100">
                <div class="card-body">
                    <div class="flex items-center gap-4">
                        <div class="form-control flex-1 max-w-xs">
                            <label class="label">
                                <span class="label-text font-semibold">Organisation</span>
                            </label>
                            {% if organizations %}
                            <select name="organization"
                                  class="select select-bordered"
                                  hx-get="{% url 'metadata:metadata_entry' %}"
                                  hx-target="#metadata-entry-root"
                                  hx-swap="innerHTML"
                                  hx-push-url="true"
                                  hx-trigger="change"
                                  aria-label="Institution auswählen">
                              {% for org in organizations %}
                              <option value="{{ org.code }}" {% if org.code == selected_organization %}selected{% endif %}>
                                  {{ org.name }}
                              </option>
                              {% endfor %}
                            </select>
                            {% else %}
                            <div class="alert alert-info alert-sm">Keine Institutionen konfiguriert.</div>
                            {% endif %}
                        </div>
                    </div>
                </div>
            </div>

            <main class="w-full">
                <div class="card bg-base-100">
                    <div class="card-body">
                        <!-- All entity tabs -->
                        <div class="mb-4">
                            <style>
                                .entity-tabs-container[role="tablist"] {
                                    display: flex !important;
                                    flex-wrap: wrap !important;
                                    white-space: normal !important;
                                    max-width: 100% !important;
                                }
                                .entity-tabs-container[role="tablist"] .tab {
                                    flex-shrink: 0 !important;
                                    min-width: fit-content !important;
                                }
                            </style>
                            <div role="tablist" class="tabs tabs-lifted tabs-sm entity-tabs-container">
                                <!-- Main entity tabs only -->
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Projekte" 
                                       checked
                                       hx-get="{% url 'metadata:tabular_projects' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Ereignisse"
                                       hx-get="{% url 'metadata:tabular_ereignis' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Akteure"
                                       hx-get="{% url 'metadata:tabular_akteur' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Orte"
                                       hx-get="{% url 'metadata:tabular_ort' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Digitale Objekte"
                                       hx-get="{% url 'metadata:tabular_digitales_objekt' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Informationstraeger"
                                       hx-get="{% url 'metadata:tabular_informationstraeger' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Physische Objekte"
                                       hx-get="{% url 'metadata:tabular_physisches_objekt' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Equipment Software"
                                       hx-get="{% url 'metadata:tabular_equipment_software' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                                <input type="radio" name="entity_tabs" role="tab" class="tab" aria-label="Equipmentart"
                                       hx-get="{% url 'metadata:tabular_equipmentart' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                       hx-target="#workspace-browse-panel"
                                       hx-swap="innerHTML"
                                       hx-trigger="click" />
                            </div>
                        </div>
                        <h2 class="text-lg font-semibold">Browse</h2>

                        <!-- Browse pane -->
                        <section id="pane-browse" class="mt-4 w-full">
                            <div id="workspace-browse-panel"
                                 hx-get="{% url 'metadata:tabular_projects' %}?embed=1{% if organization_code %}&organization={{ organization_code }}{% endif %}"
                                 hx-trigger="load"
                                 hx-target="this" hx-swap="innerHTML"></div>
                        </section>

                    </div>
                </div>
            </main>
        </div>
    </div>
</div>

{{ navbar_metadata_entry_link|safe }}
