{% load i18n %}

<!-- Canonical Property Mapping Form -->
<div id="canonical-form-{{ column.id|slugify }}" class="mt-4 p-4 bg-base-200 rounded-lg border border-base-300">
    <div class="flex items-center justify-between mb-4">
        <h4 class="text-lg font-semibold flex items-center gap-2">
            <span class="text-2xl">🧭</span>
            {% trans "Canonical Property Mapping" %}
        </h4>
        <button type="button"
                class="btn btn-ghost btn-sm"
                hx-get="{% url 'metadata:csv_hide_canonical_form' %}?column_id={{ column.id }}"
                hx-target="#canonical-form-{{ column.id|slugify }}"
                hx-swap="outerHTML">
            ✕
        </button>
    </div>

    <form hx-post="{% url 'metadata:csv_save_canonical_mapping' %}"
          hx-target="#column-{{ column.id|slugify }}"
          hx-swap="outerHTML"
          hx-trigger="submit"
          class="space-y-4">

        <input type="hidden" name="column_id" value="{{ column.id }}">
        <input type="hidden" name="organization" value="{{ organization_id }}">
        {% csrf_token %}

        <div class="bg-base-100 p-3 rounded border">
            <h5 class="font-medium text-sm mb-1">{% trans "Column Information" %}</h5>
            <p class="text-sm text-base-content/70">
                <strong>{% trans "Dataset" %}:</strong> {{ column.dataset }}<br>
                <strong>{% trans "Column" %}:</strong> {{ column.name }}
            </p>
        </div>

        <div class="form-control">
            <label class="label">
                <span class="label-text font-medium">
                    {% trans "Canonical Property" %} <span class="text-error">*</span>
                </span>
            </label>
            <select name="canonical_property_uri"
                    class="select select-bordered w-full"
                    required>
                <option value="">{% trans "Select canonical property..." %}</option>
                {% for cls in canonical_catalog %}
                    <optgroup label="{{ cls.label }}">
                        {% for prop in cls.properties %}
                            <option value="{{ prop.uri }}"
                                    {% if canonical_mapping.canonical_property_uri == prop.uri %}selected{% endif %}>
                                {{ prop.label }}
                            </option>
                        {% endfor %}
                    </optgroup>
                {% endfor %}
            </select>
        </div>

        <div class="flex justify-between items-center pt-4 border-t">
            <button type="button"
                    class="btn btn-ghost btn-sm"
                    hx-get="{% url 'metadata:csv_hide_canonical_form' %}?column_id={{ column.id }}"
                    hx-target="#canonical-form-{{ column.id|slugify }}"
                    hx-swap="outerHTML">
                {% trans "Cancel" %}
            </button>

            <div class="flex gap-2">
                {% if canonical_mapping.canonical_property_uri %}
                    <button type="button"
                            class="btn btn-outline btn-error btn-sm"
                            hx-post="{% url 'metadata:csv_remove_canonical_mapping' %}"
                            hx-vals='{"column_id": "{{ column.id }}"}'
                            hx-target="#column-{{ column.id|slugify }}"
                            hx-swap="outerHTML">
                        {% trans "Clear Mapping" %}
                    </button>
                {% endif %}
                <button type="submit" class="btn btn-primary btn-sm">
                    {% trans "Save Mapping" %}
                </button>
            </div>
        </div>
    </form>
</div>
