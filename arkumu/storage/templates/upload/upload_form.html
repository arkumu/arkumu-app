{% extends "base.html" %}
{% load static %}

{% block title %}HTMX File Upload{% endblock %}

{% block content %}
<div class="container mx-auto p-6 max-w-4xl">
    <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
            <h1 class="card-title text-2xl mb-4">Upload Files</h1>
            
            <!-- File Selection Area -->
            <div class="border-2 border-dashed border-base-300 rounded-lg p-8 text-center">
                <div class="mb-4">
                    <svg class="mx-auto h-12 w-12 text-base-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                        <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                
                <label for="file-picker" class="cursor-pointer">
                    <span class="mt-2 block text-sm font-medium text-base-content">
                        Click to select files or drag and drop
                    </span>
                    <input id="file-picker" 
                           type="file" 
                           class="hidden" 
                           multiple 
                           accept="*/*">
                </label>
                
                <!-- Optional Folder Name -->
                <div class="mt-4 max-w-sm mx-auto">
                    <label class="label">
                        <span class="label-text">Folder name (optional)</span>
                    </label>
                    <input type="text" 
                           id="folder-name" 
                           placeholder="e.g., my-documents" 
                           class="input input-bordered w-full" />
                </div>
            </div>
            
            <!-- Upload Area - Gets populated with upload forms -->
            <div id="upload-area" class="mt-6 space-y-4">
                <!-- Upload forms will be inserted here -->
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('file-picker').addEventListener('change', function(e) {
    const files = Array.from(e.target.files);
    const folderName = document.getElementById('folder-name').value.trim();
    const uploadArea = document.getElementById('upload-area');
    
    if (files.length === 0) return;
    
    // Clear previous uploads
    uploadArea.innerHTML = '';
    
    // Process each file
    files.forEach(file => {
        // Create container for this upload
        const uploadContainer = document.createElement('div');
        uploadContainer.classList.add('upload-file-container');
        uploadArea.appendChild(uploadContainer);
        
        // Build URL parameters
        const params = new URLSearchParams({
            filename: file.name,
            filetype: file.type,
            filesize: file.size.toString()
        });
        
        if (folderName) {
            params.append('folder', folderName);
        }
        
        // Use HTMX to get presigned URL and form
        htmx.ajax('GET', `/storage/upload/presigned/url/?${params}`, {
            target: uploadContainer,
            swap: 'innerHTML'
        }).then(() => {
            // Auto-populate the file input after form loads
            const fileInput = uploadContainer.querySelector('input[type="file"][name="file"]');
            if (fileInput) {
                const dt = new DataTransfer();
                dt.items.add(file);
                fileInput.files = dt.files;
            }
        });
    });
});

// Drag and drop support
const dropArea = document.querySelector('.border-dashed');

['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, preventDefaults, false);
    document.body.addEventListener(eventName, preventDefaults, false);
});

['dragenter', 'dragover'].forEach(eventName => {
    dropArea.addEventListener(eventName, highlight, false);
});

['dragleave', 'drop'].forEach(eventName => {
    dropArea.addEventListener(eventName, unhighlight, false);
});

dropArea.addEventListener('drop', handleDrop, false);

function preventDefaults(e) {
    e.preventDefault();
    e.stopPropagation();
}

function highlight() {
    dropArea.classList.add('border-primary');
}

function unhighlight() {
    dropArea.classList.remove('border-primary');
}

function handleDrop(e) {
    const dt = e.dataTransfer;
    const files = dt.files;
    
    const fileInput = document.getElementById('file-picker');
    fileInput.files = files;
    fileInput.dispatchEvent(new Event('change', { bubbles: true }));
}
</script>
{% endblock %}
