<!-- Upload Success -->
<div class="card bg-success text-success-content border border-success">
    <div class="card-body">
        <div class="flex items-center space-x-3">
            <div class="flex-shrink-0">
                <svg class="h-8 w-8" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
                </svg>
            </div>
            
            <div class="flex-1">
                <h3 class="text-sm font-medium">{{ filename }}</h3>
                <p class="text-xs opacity-80">
                    ✅ Upload successful {% if is_multipart %}(multipart){% endif %}
                </p>
                <p class="text-xs opacity-60 mt-1">
                    S3 Key: {{ s3_key }}
                </p>
            </div>
            
            <div class="flex-shrink-0">
                <button type="button" 
                        class="btn btn-ghost btn-sm"
                        onclick="this.closest('.card').remove()">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Optional: Trigger additional HTMX actions -->
        <div hx-post="/storage/upload/htmx/confirm/" 
             hx-vals='{"s3_key": "{{ s3_key }}", "filename": "{{ filename }}"}'
             hx-trigger="load"
             hx-swap="none">
        </div>
    </div>
</div>
