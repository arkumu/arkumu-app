<!-- Single file S3 upload form -->
<div class="card bg-base-100 border border-base-300">
    <div class="card-body">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="flex-shrink-0">
                    {% if 'image/' in filetype %}
                        <svg class="h-8 w-8 text-success" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
                        </svg>
                    {% elif 'video/' in filetype %}
                        <svg class="h-8 w-8 text-info" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z" />
                        </svg>
                    {% else %}
                        <svg class="h-8 w-8 text-base-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" />
                        </svg>
                    {% endif %}
                </div>
                
                <div class="flex-1">
                    <h3 class="text-sm font-medium text-base-content">{{ filename }}</h3>
                    <p class="text-xs text-base-content/60">
                        {{ filesize|filesizeformat }} • {{ filetype }}
                    </p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button type="button" 
                        class="btn btn-ghost btn-sm"
                        hx-get="/storage/upload/presigned/cancel/?filename={{ filename|urlencode }}"
                        hx-target="closest .card"
                        hx-swap="outerHTML">
                    Cancel
                </button>
            </div>
        </div>
        
        <!-- S3 Upload Form -->
        <form action="{{ presigned_url }}" 
              method="post" 
              enctype="multipart/form-data"
              hx-post="{{ presigned_url }}"
              hx-trigger="submit"
              hx-target="closest .card"
              hx-swap="outerHTML"
              hx-indicator="closest .card .upload-progress"
              class="mt-4">
            
            <!-- S3 Required Fields -->
            {% for key, value in fields.items %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
            {% endfor %}
            
            <!-- File Input (hidden, will be populated by JavaScript) -->
            <input type="file" 
                   name="file" 
                   style="display: none;" 
                   required>
            
            <!-- Progress Indicator -->
            <div class="upload-progress hidden mb-4">
                <div class="flex items-center space-x-2">
                    <span class="loading loading-spinner loading-sm"></span>
                    <span class="text-sm">Uploading to S3...</span>
                </div>
                <progress class="progress progress-primary w-full" max="100"></progress>
            </div>
            
            <!-- Upload Button -->
            <div class="flex justify-between items-center mt-4">
                <div class="text-xs text-base-content/60">
                    Direct upload to S3 • Max {{ max_file_size|default:"5GB"|filesizeformat }}
                </div>
                <button type="submit" class="btn btn-primary btn-sm">
                    <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    Upload {{ filename }}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
// Show progress when upload starts
document.querySelector('.card form').addEventListener('htmx:beforeRequest', function(evt) {
    const progressDiv = this.querySelector('.upload-progress');
    if (progressDiv) {
        progressDiv.classList.remove('hidden');
    }
});
</script>
