<!-- Single file S3 upload form -->
<div class="card bg-base-100 border border-base-300">
    <div class="card-body">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="flex-shrink-0">
                    {% if 'image/' in filetype %}
                        <svg class="h-8 w-8 text-success" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
                        </svg>
                    {% elif 'video/' in filetype %}
                        <svg class="h-8 w-8 text-info" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M2 6a2 2 0 012-2h6a2 2 0 012 2v8a2 2 0 01-2 2H4a2 2 0 01-2-2V6zM14.553 7.106A1 1 0 0014 8v4a1 1 0 00.553.894l2 1A1 1 0 0018 13V7a1 1 0 00-1.447-.894l-2 1z" />
                        </svg>
                    {% else %}
                        <svg class="h-8 w-8 text-base-400" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4z" clip-rule="evenodd" />
                        </svg>
                    {% endif %}
                </div>
                
                <div class="flex-1">
                    <h3 class="text-sm font-medium text-base-content">{{ filename }}</h3>
                    <p class="text-xs text-base-content/60">
                        {{ filesize|filesizeformat }} • {{ filetype }}
                    </p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button type="button" 
                        class="btn btn-ghost btn-sm"
                        hx-get="/storage/upload/presigned/cancel/?filename={{ filename|urlencode }}"
                        hx-target="closest .card"
                        hx-swap="outerHTML">
                    Cancel
                </button>
            </div>
        </div>
        
        <!-- S3 Upload Form -->
        <form action="{{ presigned_url }}" 
              method="post" 
              enctype="multipart/form-data"
              class="mt-4 s3-upload-form"
              data-filename="{{ filename }}"
              data-s3-key="{{ s3_key }}">
            
            <!-- S3 Required Fields -->
            {% for key, value in fields.items %}
                <input type="hidden" name="{{ key }}" value="{{ value }}">
            {% endfor %}
            
            <!-- File Input (will be populated by JavaScript) -->
            <input type="file" 
                   name="file" 
                   class="s3-file-input"
                   style="display: none;" 
                   required>
            
            <!-- Progress Indicator -->
            <div class="upload-progress hidden mb-4">
                <div class="flex items-center space-x-2">
                    <span class="loading loading-spinner loading-sm"></span>
                    <span class="text-sm">Uploading to S3...</span>
                </div>
                <progress class="progress progress-primary w-full" max="100"></progress>
            </div>
            
            <!-- Upload Button -->
            <div class="flex justify-between items-center mt-4">
                <div class="text-xs text-base-content/60">
                    Direct upload to S3 • Max {{ max_file_size|default:"5GB"|filesizeformat }}
                </div>
                <button type="submit" class="btn btn-primary btn-sm">
                    <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                    </svg>
                    Upload {{ filename }}
                </button>
            </div>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('.s3-upload-form');
    if (!form) return;
    
    const fileInput = form.querySelector('.s3-file-input');
    const uploadButton = form.querySelector('button[type="submit"]');
    const progressDiv = form.querySelector('.upload-progress');
    const filename = form.dataset.filename;
    const uploadMethod = '{{ method|default:"POST" }}';
    
    console.log('🔗 S3 Form initialized for:', filename);
    
    // Handle form submission with XMLHttpRequest for proper S3 upload
    form.addEventListener('submit', function(e) {
        e.preventDefault(); // Prevent default form submission
        
        console.log('🚀 S3 form submitting for:', filename);
        
        if (!fileInput.files || fileInput.files.length === 0) {
            console.error('❌ No file selected for upload');
            alert('No file selected. Please try selecting the file again.');
            return;
        }
        
        const file = fileInput.files[0];
        console.log('📤 Uploading file:', file.name, file.size + ' bytes');
        
        // Show progress
        if (progressDiv) {
            progressDiv.classList.remove('hidden');
        }
        
        // Disable button
        uploadButton.disabled = true;
        uploadButton.innerHTML = `
            <span class="loading loading-spinner loading-sm mr-2"></span>
            Uploading...
        `;

        // Create XMLHttpRequest for S3 upload
        const xhr = new XMLHttpRequest();

        // Handle upload progress
        xhr.upload.addEventListener('progress', function(e) {
            if (e.lengthComputable) {
                const percentComplete = (e.loaded / e.total) * 100;
                console.log(`📊 Upload progress: ${percentComplete.toFixed(1)}%`);
                // Update progress bar if available
                const progressBar = progressDiv?.querySelector('progress');
                if (progressBar) {
                    progressBar.value = percentComplete;
                }
            }
        });

        // Handle upload completion
        xhr.addEventListener('load', function() {
            console.log('🎉 S3 upload completed!', xhr.status);
            if (xhr.status >= 200 && xhr.status < 300) {
                form.outerHTML = `
                    <div class="alert alert-success">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        <span>✅ ${filename} uploaded successfully!</span>
                    </div>
                `;
                if (typeof updateUploadControls === 'function') {
                    updateUploadControls();
                }
            } else {
                console.error('❌ S3 upload failed:', xhr.status, xhr.statusText);
                showUploadError('Upload failed: ' + xhr.statusText);
            }
        });

        // Handle upload error
        xhr.addEventListener('error', function() {
            console.error('❌ S3 upload error');
            showUploadError('Upload failed: Network error');
        });

        if (uploadMethod === 'PUT') {
            // Send the raw file via PUT with Content-Type header
            xhr.open('PUT', form.action);
            const contentType = file.type || 'application/octet-stream';
            try { xhr.setRequestHeader('Content-Type', contentType); } catch (e) {}
            xhr.send(file);
        } else {
            // Create FormData from the form (presigned POST)
            const formData = new FormData(form);
            formData.append('file', file);
            xhr.open('POST', form.action);
            xhr.send(formData);
        }
    });
    
    // Helper function to show upload error
    function showUploadError(message) {
        // Re-enable button
        uploadButton.disabled = false;
        uploadButton.innerHTML = `
            <svg class="h-4 w-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            Upload {{ filename }}
        `;
        
        // Hide progress
        if (progressDiv) {
            progressDiv.classList.add('hidden');
        }
        
        // Show error message
        form.insertAdjacentHTML('afterend', `
            <div class="alert alert-error mt-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z" />
                </svg>
                <span>❌ ${message}</span>
            </div>
        `);
    }
});
</script>
