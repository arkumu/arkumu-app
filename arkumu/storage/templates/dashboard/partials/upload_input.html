<div class="form-control mb-4" id="upload-input-section" hx-swap-oob="outerHTML">
    <label class="label">
        <span class="label-text">
            {% if is_folder_mode %}
                Select Folder
            {% else %}
                Select Files
            {% endif %}
        </span>
    </label>
    <input type="file" 
           name="files" 
           {% if is_folder_mode %}
               webkitdirectory
               directory
           {% else %}
               multiple
           {% endif %}
           class="file-input file-input-bordered file-input-sm w-full" />
    {% if is_folder_mode %}
        <input type="hidden" name="preserve_folder_structure" value="true" />
    {% endif %}
    <div class="text-xs text-gray-500 mt-1">
        {% if is_folder_mode %}
            Select a folder to upload all files within it
        {% else %}
            You can select multiple files to upload to S3 at once
        {% endif %}
    </div>
</div>

<!-- Update button styles with OOB -->
<div id="files-mode-btn" hx-swap-oob="outerHTML">
    <button type="button" 
            class="btn btn-outline btn-sm flex-1 {% if not is_folder_mode %}btn-active{% endif %}" 
            id="files-mode-btn"
            hx-get="/storage/dashboard/upload-mode/"
            hx-vals='{"mode": "files"}'
            hx-include="this"
            hx-swap="none">
        📄 Upload Files
    </button>
</div>

<div id="folder-mode-btn" hx-swap-oob="outerHTML">
    <button type="button" 
            class="btn btn-outline btn-sm flex-1 {% if is_folder_mode %}btn-active{% endif %}" 
            id="folder-mode-btn"
            hx-get="/storage/dashboard/upload-mode/"
            hx-vals='{"mode": "folder"}'
            hx-include="this"
            hx-swap="none">
        📁 Upload Folder
    </button>
</div>
