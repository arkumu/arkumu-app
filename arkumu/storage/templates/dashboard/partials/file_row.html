{% load storage_extras %}

<li data-file-path="{{ item.path }}">
    <div class="flex items-center py-3 px-4 hover:bg-base-50 rounded-lg transition-colors gap-2">
        <div class="flex items-center gap-1 flex-shrink-0">
            <form
                hx-post="{% url 'storage:verify_file' %}"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                hx-target="closest li"
                hx-swap="outerHTML"
                class="inline-flex"
            >
                <input type="hidden" name="organization" value="{{ organization }}">
                <input type="hidden" name="path" value="{{ item.path }}">
                <input type="hidden" name="prefix" value="{{ listing_prefix }}">
                <button type="submit"
                        class="btn btn-ghost btn-xs btn-square text-success hover:bg-success/10"
                        title="Verify file in S3">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                </button>
            </form>

            {% if item.name|is_viewable_file %}
                <button hx-get="{% url 'storage:file_viewer' bucket_type=bucket_type file_path=item.path %}"
                        hx-target="#file-viewer-modal .modal-box"
                        hx-swap="innerHTML"
                        class="btn btn-ghost btn-xs btn-square text-info hover:bg-info/10"
                        title="Preview file"
                        onclick="document.getElementById('file-viewer-modal').showModal()">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </button>
            {% else %}
                <button class="btn btn-ghost btn-xs btn-square btn-disabled opacity-30"
                        title="File viewing not available">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                </button>
            {% endif %}

            <button hx-post="{% url 'storage:delete_object' bucket_type=bucket_type object_type='file' object_path=item.path %}"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-target="closest li"
                    hx-swap="outerHTML"
                    hx-confirm="Are you sure you want to delete this file? This cannot be undone."
                    class="btn btn-ghost btn-xs btn-square text-error hover:bg-error/10"
                    title="Delete File">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
            </button>
        </div>

        <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2">
                <span class="font-medium text-base truncate block" title="{{ item.name }}">{{ item.name }}</span>
                {% if item.verified %}
                <span class="badge badge-xs badge-success" title="Verified in S3">✓</span>
                {% endif %}
            </div>
            {% if item.size %}
                <span class="text-sm opacity-60">{{ item.size|filesizeformat }}</span>
            {% endif %}
        </div>
    </div>
</li>
