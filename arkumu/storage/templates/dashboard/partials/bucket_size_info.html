<div id="bucket-size-container"
     class="btn btn-info btn-sm gap-2 text-info-content"
     hx-get="{% url 'storage:bucket_size_info' organization %}?force_fresh=true"
     hx-swap="outerHTML"
     title="Refresh bucket size for {{ organization|upper }}"
     data-organization="{{ organization }}">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
    </svg>
    {% if success %}
        <span class="font-semibold text-sm">{{ total_size_formatted }}</span>
        <span class="badge badge-ghost badge-xs">{{ object_count|default:0|floatformat:0 }} files</span>
    {% else %}
        <span class="text-error text-sm font-semibold">Error</span>
        <span class="text-error/70 text-xs">{{ error|default:"Unavailable"|truncatechars:40 }}</span>
    {% endif %}
    <span class="loading loading-spinner loading-xs htmx-indicator" hidden></span>
</div>
