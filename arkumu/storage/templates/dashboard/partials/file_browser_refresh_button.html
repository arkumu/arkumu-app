{% if selected_org_slug %}
<button type="button"
        class="btn btn-accent btn-sm gap-2"
        hx-get="{% url 'storage:refresh_file_browser' selected_org_slug %}?force_fresh=true"
        hx-target="#file-browser-content"
        hx-swap="innerHTML"
        hx-indicator="#loading-indicator"
        title="Force refresh folder listings from S3">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
    </svg>
    Refresh
</button>
{% else %}
<button type="button" class="btn btn-accent btn-sm gap-2 btn-disabled" disabled>
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
    </svg>
    Refresh
</button>
{% endif %}
