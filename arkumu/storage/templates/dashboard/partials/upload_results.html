<div id="upload-results" hx-swap-oob="outerHTML" class="mt-4">
    <div class="alert alert-success">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 stroke-current shrink-0" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <div>
            <h3 class="font-bold">Upload Complete!</h3>
            <div class="text-sm">
                <span id="result-files-count">{{ files_count }}</span> files uploaded to S3
                (<span id="result-total-size">{{ total_size }}</span>)
                in <span id="result-duration">{{ duration }}s</span>
            </div>
        </div>
        <button class="btn btn-sm btn-ghost" 
                hx-get="/storage/dismiss-message/"
                hx-target="#upload-results"
                hx-swap="outerHTML">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
        </button>
    </div>
</div>
