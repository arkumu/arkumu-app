{% comment %}
Error template for file viewer
{% endcomment %}

<div class="flex items-center justify-between mb-4">
    <h3 class="font-bold text-lg">Error Loading {{ filename|default:"File" }}</h3>
    <button class="btn btn-sm btn-circle btn-ghost" onclick="document.getElementById('file-viewer-modal').close()">✕</button>
</div>

<div class="divider my-2"></div>

<div class="alert alert-error">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <div>
        <h3 class="font-bold">Failed to Load File Preview</h3>
        <div class="text-sm">{{ error }}</div>
    </div>
</div>

{% if file_path %}
<div class="mt-4 p-4 bg-base-200 rounded-lg">
    <div class="text-sm text-base-content/70">
        <p><strong>File Path:</strong> {{ file_path }}</p>
        {% if filename %}
            <p><strong>Filename:</strong> {{ filename }}</p>
        {% endif %}
    </div>
</div>
{% endif %}

<div class="modal-action">
    <button class="btn btn-sm btn-secondary" onclick="document.getElementById('file-viewer-modal').close()">
        Close
    </button>
</div>
