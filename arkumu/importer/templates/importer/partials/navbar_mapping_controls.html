<!-- Compact Mapping Controls for Navbar -->
<div class="flex items-center gap-3">
    <!-- Mapping Selection Dropdown -->
    <div class="flex items-center gap-2">
        <span class="text-sm font-medium text-base-content/70">Mapping:</span>
        <div class="dropdown dropdown-bottom dropdown-end">
            <div tabindex="0" role="button" class="btn btn-sm btn-outline gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
                </svg>
                <span id="selected-mapping-name">{% if selected_mapping %}{{ selected_mapping.name }}{% else %}Select mapping{% endif %}</span>
                <svg class="w-3 h-3 fill-current opacity-60" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 2048">
                    <path d="M1799 349l242 241-1017 1017L7 590l242-241 775 775 775-775z"></path>
                </svg>
            </div>
            <ul tabindex="0" class="dropdown-content menu bg-base-100 rounded-box z-[1] w-80 p-2 shadow-lg border border-base-300">
                <li class="menu-title">
                    <span>Available Mappings</span>
                </li>
                <div id="mapping-dropdown-list" 
                     hx-get="{% url 'importer:list_mappings_dropdown' %}"
                     hx-trigger="load once"
                     hx-vals='{"organization": "{{ organization_id }}"}'
                     hx-swap="innerHTML">
                    <li><a class="text-base-content/50">Loading mappings...</a></li>
                </div>
                <div class="divider my-1"></div>
                <li>
                    <a class="text-sm text-primary" href="{% url 'metadata:csv_mapping_editor' %}">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                        </svg>
                        Create new mapping
                    </a>
                </li>
                <li>
                    <a class="text-sm text-accent" 
                       hx-get="{% url 'importer:list_importable_mappings' %}"
                       hx-target="#import_mappings_modal .modal-box"
                       onclick="import_mappings_modal.showModal()">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
                        </svg>
                        Import mappings
                    </a>
                </li>
            </ul>
        </div>
    </div>
    
    <!-- Import History Link (for accessing completed import results) -->
    <div class="flex items-center">
        <a href="{% url 'importer:import_results_dashboard' %}" 
           class="btn btn-sm btn-outline gap-2" 
           title="View completed import results and analysis">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/>
            </svg>
            Import History
        </a>
    </div>

    {% if selected_mapping %}
    <!-- Mapping Actions (when mapping is selected) -->
    <div class="flex items-center gap-1">
        <!-- Overview Button -->
        <button class="btn btn-xs btn-primary" 
                hx-get="{% url 'metadata:mapping_overview_data' %}"
                hx-vals='{"organization": "{{ organization_code }}", "mapping_id": "{{ selected_mapping.id }}"}'
                hx-target="#mapping-overview-modal"
                hx-swap="outerHTML"
                title="View mapping overview">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Overview
        </button>
        
        <!-- Graph Visualizer Button -->
        <a href="{% url 'metadata:mapping_visualizer_graphviz' selected_mapping.id %}" 
           target="_blank"
           class="btn btn-xs btn-primary"
           title="View mapping visualizer">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
            </svg>
            Graph
        </a>
        
        <!-- Blueprint/Schema Visualizer Button -->
        <a href="{% url 'metadata:blueprint_visualizer_graphviz' selected_mapping.id %}" 
           target="_blank"
           class="btn btn-xs btn-primary"
           title="View blueprint/schema visualizer">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                <path d="M4 3a1 1 0 000 2h12a1 1 0 100-2H4zM3 8a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM4 12a1 1 0 100 2h8a1 1 0 100-2H4z"/>
                <path d="M17 11a1 1 0 100 2 1 1 0 000-2zM17 15a1 1 0 100 2 1 1 0 000-2z"/>
            </svg>
            Schema
        </a>
        
        <!-- RDF Preview Visualizer Button -->
        <a href="{% url 'metadata:rdf_preview_visualizer' selected_mapping.id %}" 
           target="_blank"
           class="btn btn-xs btn-primary"
           title="View RDF preview with sample triples">
            <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20">
                <path d="M7 3a1 1 0 000 2h6a1 1 0 100-2H7zM4 7a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1zM2 11a2 2 0 012-2h12a2 2 0 012 2v4a2 2 0 01-2 2H4a2 2 0 01-2-2v-4z"/>
            </svg>
            RDF
        </a>
        
    </div>
    {% endif %}
</div>

<!-- Hidden form for HTMX mapping selection -->
<input type="hidden" id="selected-mapping-id" name="mapping_id" value="{{ selected_mapping.id|default:'' }}">

<script>
// Handle mapping selection from dropdown - use event delegation with a unique handler
(function() {
    // Remove any existing handlers to prevent duplicates
    if (window.navbarMappingHandler) {
        document.removeEventListener('click', window.navbarMappingHandler);
    }
    
    // Create and store the event handler
    window.navbarMappingHandler = function(e) {
        const mappingElement = e.target.closest('[data-mapping-id]');
        if (!mappingElement) return;
        
        // Prevent multiple rapid clicks
        if (mappingElement.dataset.loading === 'true') return;
        mappingElement.dataset.loading = 'true';
        
        const mappingId = mappingElement.dataset.mappingId;
        const mappingName = mappingElement.dataset.mappingName;
        
        // Update hidden input
        const hiddenInput = document.getElementById('selected-mapping-id');
        if (hiddenInput) {
            hiddenInput.value = mappingId;
        }
        
        // Update display name
        const nameDisplay = document.getElementById('selected-mapping-name');
        if (nameDisplay) {
            nameDisplay.textContent = mappingName || 'Select mapping';
        }
        
        // Load mapping via HTMX - update navbar controls and let execution status update via event
        htmx.ajax('POST', '{% url "importer:ingest_data" %}', {
            values: {
                organization: '{{ organization_id }}',
                action: 'load_mapping',
                mapping_id: mappingId,
                csrfmiddlewaretoken: '{{ csrf_token }}'
            },
            target: '#navbar-end',
            swap: 'innerHTML'
        }).then(() => {
            // Clean up loading state
            mappingElement.dataset.loading = 'false';
            // Trigger custom event for execution status to update itself
            htmx.trigger('body', 'mappingSelected', {mappingId: mappingId, mappingName: mappingName});
        }).catch(() => {
            // Clean up loading state on error
            mappingElement.dataset.loading = 'false';
        });
        
        // Close dropdown
        if (document.activeElement) {
            document.activeElement.blur();
        }
    };
    
    // Add the event listener
    document.addEventListener('click', window.navbarMappingHandler);
})();


</script>

<!-- Import Mappings Modal -->
<dialog id="import_mappings_modal" class="modal">
    <div class="modal-box w-11/12 max-w-3xl">
        <!-- Content will be loaded here -->
        <div class="text-center py-8">
            <span class="loading loading-spinner loading-lg"></span>
            <p class="mt-4 text-base-content/60">Preparing import interface...</p>
        </div>
    </div>
    <form method="dialog" class="modal-backdrop">
        <button>close</button>
    </form>
</dialog>

<!-- Hidden button to handle modal close trigger -->
<button hx-trigger="closeImportModal from:body" 
        onclick="import_mappings_modal.close()" 
        style="display:none"></button>
