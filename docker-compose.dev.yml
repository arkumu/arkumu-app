volumes:
  dev_postgres_data: {}
  dev_postgres_data_backups: {}
  dev_redis_data: {}

networks:
  arkumu_dev_network:
    driver: bridge

services:
  django:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: arkumu_dev_django
    container_name: arkumu_dev_django
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app:z
      - ./compose/dev/django/start:/start:z
    env_file:
      - ./.envs/.dev/.django
      - ./.envs/.dev/.postgres
      - ./.envs/.dev/.docker
    ports:
      - '127.0.0.1:8000:8000'
    command: /start
    networks:
      - arkumu_dev_network
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${S3_HOSTNAME}:${S3_IP}"

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: arkumu_dev_postgres
    container_name: arkumu_dev_postgres
    restart: unless-stopped
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
      - dev_postgres_data_backups:/backups
    env_file:
      - ./.envs/.dev/.postgres
    networks:
      - arkumu_dev_network

  redis:
    image: "redis:latest"
    container_name: arkumu_dev_redis
    restart: unless-stopped
    volumes:
      - dev_redis_data:/data
    networks:
      - arkumu_dev_network

  huey:
    build:
      context: .
      dockerfile: ./compose/production/django/Dockerfile
    image: arkumu_dev_huey
    container_name: arkumu_dev_huey
    restart: unless-stopped
    depends_on:
      - django
      - redis
    volumes:
      - .:/app:z
    env_file:
      - ./.envs/.dev/.django
      - ./.envs/.dev/.postgres
      - ./.envs/.dev/.docker
    command: /bin/sh -c "python manage.py run_huey"
    networks:
      - arkumu_dev_network
    dns:
      - ${DNS_PRIMARY}
      - ${DNS_SECONDARY}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${S3_HOSTNAME}:${S3_IP}"
